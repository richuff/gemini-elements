<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon/Rounded Card -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="#0d1117" stroke="url(#geminiGrad)" stroke-width="3"/>

  <!-- Orbital Rings -->
  <ellipse cx="100" cy="100" rx="68" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="68" ry="24" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="68" ry="24" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" transform="rotate(90 100 100)"/>

  <!-- Electrons / Particle Nodes -->
  <circle cx="152" cy="70" r="5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="48" cy="130" r="5" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="100" cy="32" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Central Chemical Element Box (e.g. C / Ge) -->
  <rect x="74" y="74" width="52" height="52" rx="10" fill="#161b22" stroke="url(#geminiGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="108" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="#f8fafc" text-anchor="middle">Ge</text>
  <text x="82" y="88" font-family="monospace" font-size="9" fill="#94a3b8" font-weight="bold">4</text>
  <text x="100" y="120" font-family="sans-serif" font-size="7" fill="#38bdf8" text-anchor="middle" font-weight="600">GEMINI</text>
</svg>
